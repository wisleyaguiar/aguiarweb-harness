name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell
        # shortcut: only shellcheck errors fail (0 today; 13 warnings remain), raise to --severity=warning once they are fixed.
        env:
          SHELLCHECK_OPTS: --severity=error
        run: |
          shellcheck --version
          scripts/check-shell.sh

      - name: Init drift
        run: scripts/check-init-drift.sh

      - name: Plugin manifests
        run: scripts/check-codex-plugin.sh

      - name: ralph.sh (mock engines)
        run: scripts/test-ralph.sh

      - name: Claude plugin validate
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
